<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index.</title>
    <style>
      html { background: #efe8de; color: #46463e; }
      @media (prefers-color-scheme: dark) { html { background: #1d1f1d; color: #ddd6c9; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
        letter-spacing: 0.02em; }
      a { color: inherit; }
    </style>
    <script>
      /*
        A visitor typed XX.com/YY.net straight into the bar and the host had no
        such document. Rewrite it to the one real page, XX.com/?url=YY.net,
        before anything is painted.
      */
      (function () {
        try {
          var segments = window.location.pathname.split("/").filter(Boolean);
          var last = segments.pop() || "";
          var dir = "/" + (segments.length ? segments.join("/") + "/" : "");
          var target = decodeURIComponent(last).replace(/^https?:\/\//i, "");
          window.location.replace(target ? dir + "?url=" + encodeURIComponent(target) : dir);
        } catch (e) {
          window.location.replace("/");
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">index.</a></p>
  </body>
</html>
