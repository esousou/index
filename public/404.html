<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index-z.</title>
    <style>
      html { background: #efe8de; color: #46463e; }
      @media (prefers-color-scheme: dark) { html { background: #1d1f1d; color: #ddd6c9; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
        letter-spacing: 0.02em; }
      a { color: inherit; }
    </style>
    <script>
      /*
        A visitor typed index-z.pages.dev/YY.net/path straight into the bar and the host
        served no document for it. Carry the ENTIRE destination path into the app
        before anything is painted — never just the last segment. The app then puts
        the address back into its path form, so the bar ends up showing /YY.net/path.
      */
      (function () {
        try {
          var segments = window.location.pathname.split("/").filter(Boolean);
          var hostAt = -1;
          for (var i = 0; i < segments.length; i++) {
            var part = decodeURIComponent(segments[i]);
            if (part === "localhost" || /\./.test(part)) {
              hostAt = i;
              break;
            }
          }

          var search = new URLSearchParams(window.location.search);
          var lang = search.get("lang");
          if (hostAt < 0) {
            window.location.replace("/" + (lang ? "?lang=" + encodeURIComponent(lang) : ""));
            return;
          }

          var trailing = /\/$/.test(window.location.pathname) ? "/" : "";
          var target =
            decodeURIComponent(segments.slice(hostAt).join("/")).replace(/^https?:\/\//i, "") + trailing;
          search.set("url", target);
          if (lang) search.set("lang", lang);
          window.location.replace("/?" + search.toString());
        } catch (e) {
          window.location.replace("/");
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">index-z.</a></p>
  </body>
</html>
