    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem("index.theme.v1");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#1d1f1d");
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Keep the canonical honest before the app mounts: a destination page
      // (/YY.net or /?url=YY.net) is its own page, not a duplicate of the home page.
      (function () {
        try {
          var canonical = document.querySelector('link[rel="canonical"]');
          var ogUrl = document.querySelector('meta[property="og:url"]');
          var href = location.origin + "/";
          
          // Check for path-based URL (/example.com) or query-based URL (/?url=example.com)
          var target = null;
          var pathSegments = location.pathname.split("/").filter(Boolean);
          var hostAt = -1;
          for (var i = 0; i < pathSegments.length; i++) {
            var segment = decodeURIComponent(pathSegments[i]);
            if (segment === "localhost" || /\./.test(segment)) {
              hostAt = i;
              break;
            }
          }
          if (hostAt >= 0) {
            target = decodeURIComponent(pathSegments.slice(hostAt).join("/")).replace(/^https?:\/\//i, "");
          }
          if (!target) {
            target = new URLSearchParams(location.search).get("url");
          }
          
          if (target) {
            var bare = target.replace(/^https?:\/\//i, "").replace(/\/$/, "");
            if (/\./.test(bare)) {
              // Encode each path segment, never the separators.
              var routePath = bare
                .split("/")
                .filter(Boolean)
                .map(function (part) {
                  return encodeURIComponent(part);
                })
                .join("/");
              href = location.origin + "/" + routePath;
            }
          }
          
          if (canonical) canonical.setAttribute("href", href);
          if (ogUrl) ogUrl.setAttribute("content", href);
        } catch (e) {}
      })();
    </script>

        <p>
          index-z. is a peer-to-peer link directory. Visitors publish web addresses to it, and those
          addresses live only in the memory of the browsers currently connected — there is no
          database and no account. Every published link expires 24 hours after it is shared.
        </p>
        <p>
          Publishing costs <em>index</em>, one per character of the address; one index is earned for
          every ten seconds spent on the site while connected to the internet. Opening a listed link
          leads to a page of the form <code>/example.com</code>, which prints the destination as
          a plain link and never forwards you by itself.
        </p>
        <p>
          The interactive ledger — publishing, earning index, and exchanging links with other visitors
          over WebRTC — requires JavaScript.
        </p>
